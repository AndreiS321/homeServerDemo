---
- name: Configure firewall
  become: true
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow ssh
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow nginx ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 80
        - 443
        - 1080

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        policy: deny
